name: CI

# Activates once coxstream is its own repository (GitHub runs workflows only
# from .github/workflows/ at the repository root). In this monorepo it lives
# under packages/coxstream/ so it travels with the package when split out.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Citation metadata version matches pyproject
        # Zenodo labels each archived release from .zenodo.json, so a stale
        # version there mislabels the record (v0.2.0 was archived as "0.1.1").
        run: |
          python - <<'EOF'
          import json
          import re
          from pathlib import Path
          pkg = re.search(r'^version\s*=\s*"([^"]+)"', Path("pyproject.toml").read_text(), re.M).group(1)
          cff = re.search(r'^version:\s*"([^"]+)"', Path("CITATION.cff").read_text(), re.M).group(1)
          zen = json.loads(Path(".zenodo.json").read_text())["version"]
          ini = re.search(r'^__version__ = "([^"]+)"', Path("src/coxstream/__init__.py").read_text(), re.M).group(1)
          if not pkg == cff == zen == ini:
              raise SystemExit(f"version mismatch: pyproject {pkg}, CITATION.cff {cff}, .zenodo.json {zen}, __init__ {ini}")
          print(f"citation metadata matches version {pkg}")
          EOF

      - name: Install (compiles the Cython kernel) with test + parquet extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,parquet]'

      - name: Lint
        run: |
          pip install ruff==0.16.1  # pinned: an unpinned ruff drifts to new rules and breaks CI
          ruff check .

      - name: Test
        run: pytest -q
